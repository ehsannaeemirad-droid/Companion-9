<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TS3">
<title>Touchstone 3 Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0A0A0F; --card:#14141B; --card-2:#1C1C26;
  --fg:#F5F5F7; --fg-soft:#B8B8C4; --muted:#8A8A99;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --accent:#6E8BFF;
  --ok:#4ADE80; --ok-soft:rgba(74,222,128,.14);
  --bad:#F87171; --bad-soft:rgba(248,113,113,.14);
  --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --farsi:"Vazirmatn",Tahoma,sans-serif;
  --c-vocab:#A78BFA; --c-matching:#60A5FA; --c-gap:#5EEAD4;
  --c-grammar:#FBBF24; --c-test:#FB7185; --c-passage:#FB923C;
  --c-reading:#34D399; --c-writing:#F472B6; --c-overview:#6E8BFF; --c-wrap:#6E8BFF;
  --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
}
[data-theme="light"]{
  --bg:#F5F5F7; --card:#FFFFFF; --card-2:#F0F0F4;
  --fg:#1A1A1E; --fg-soft:#4B4B55; --muted:#8A8A94;
  --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.14);
  --accent:#4F6FE8; --c-vocab:#7C5CE0; --c-matching:#3B82F6;
  --c-gap:#14B8A6; --c-grammar:#D97706; --c-test:#E11D48;
  --c-passage:#EA580C; --c-reading:#059669; --c-writing:#DB2777;
  --c-overview:#4F6FE8; --c-wrap:#4F6FE8;
  --ok:#15803D; --bad:#DC2626; --warn:#B45309; --muted:#6B6B76;
  --ok-soft:rgba(21,128,61,.12); --bad-soft:rgba(220,38,38,.1); --warn-soft:rgba(180,83,9,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hidden{display:none !important}

/* ============ FIXED CHROME ============ */
.map-btn,.back-btn{position:fixed;top:calc(14px + var(--safe-top));z-index:35;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(20,20,27,.85);border:1px solid var(--line);color:var(--fg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .1s,opacity .35s;opacity:0;pointer-events:none}
.map-btn{right:14px}
.back-btn{left:14px}
[data-theme="light"] .map-btn,[data-theme="light"] .back-btn{background:rgba(255,255,255,.9)}
.map-btn:active,.back-btn:active{transform:scale(.94)}
.map-btn svg{width:18px;height:18px}
.back-btn svg{width:16px;height:16px}
.map-btn.chrome-visible,.back-btn.chrome-visible{opacity:1;pointer-events:auto}

/* ============ HUD ============ */
.hud{position:fixed;bottom:calc(28px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);z-index:29;padding:8px 14px;background:rgba(20,20,27,.9);border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;color:var(--fg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;max-width:90vw}
[data-theme="light"] .hud{background:rgba(255,255,255,.92)}
.hud.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.hud .num{font-variant-numeric:tabular-nums}
.hud .num b{color:var(--c,var(--accent))}
.hud .hud-bar{width:60px;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.hud .hud-bar i{display:block;height:100%;background:var(--c,var(--accent));transition:width .2s;border-radius:4px}
.hud .hud-pct{font-size:11px;opacity:.7}

/* ============ HOME ============ */
.home{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);z-index:40;padding:calc(28px + var(--safe-top)) 20px calc(28px + var(--safe-bottom))}
.home.hidden{display:none}
.home-inner{max-width:560px;margin:0 auto}
.home-brand{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;margin-bottom:18px}
.home-title{max-width:14ch;font-size:clamp(30px,7.6vw,42px);font-weight:850;letter-spacing:-.045em;line-height:1.08;margin:0 0 14px;color:var(--fg);text-wrap:balance}
.home-greet{font-size:15px;color:var(--fg-soft);margin-bottom:32px}
.home-greet b{color:var(--fg);font-weight:600}
.resume-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:linear-gradient(135deg,rgba(110,139,255,.14),var(--card));border:1px solid rgba(110,139,255,.3);border-radius:16px;margin-bottom:28px;width:100%;text-align:left;transition:all .15s}
.resume-card:hover{transform:translateY(-1px);border-color:rgba(110,139,255,.5)}
.resume-card .ic{font-size:22px;flex-shrink:0}
.resume-card .info{flex:1;min-width:0}
.resume-card .kicker{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.resume-card .title{font-size:14.5px;font-weight:700;line-height:1.3}
.resume-card .arrow{font-size:18px;color:var(--accent);flex-shrink:0}
.home-section-head{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:24px 2px 12px}
.unit-row{display:flex;align-items:baseline;gap:10px;padding:20px 2px 8px}
.unit-row .un{font-size:13px;font-weight:800;color:var(--accent)}
.unit-row .ul{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.unit-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0 6px;color:var(--fg);font:inherit}.unit-row .un{font-weight:800}.unit-row .ul{flex:1;color:var(--muted);font-size:13px}.unit-lessons{padding-left:8px}.unit-lessons[hidden]{display:none}.unit-chevron{font-size:18px}
.tile{display:block;width:100%;padding:16px 18px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;transition:all .15s;position:relative;overflow:hidden}
.tile:not(:disabled):hover{border-color:var(--tile-c,var(--accent));transform:translateY(-1px)}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tile-c,var(--accent))}
.tile-row{display:flex;align-items:center;gap:14px}
.tile-badge{width:42px;height:42px;border-radius:11px;flex:0 0 42px;display:grid;place-items:center;background:rgba(255,255,255,.05);font-size:13px;font-weight:800;color:var(--tile-c,var(--accent))}
[data-theme="light"] .tile-badge{background:rgba(0,0,0,.04)}
.tile-body{flex:1;min-width:0}
.tile-title{font-size:14.5px;font-weight:600;line-height:1.35;margin-bottom:3px}
.tile-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.tile-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:rgba(255,255,255,.06);color:var(--fg-soft)}
.tile-tag.ready{background:rgba(110,139,255,.16);color:var(--accent)}
.tile-tag.done{background:var(--ok-soft);color:var(--ok)}
.tile-tag.soon{background:rgba(255,255,255,.04);color:var(--muted)}
.home-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.home-link{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--card);border:1px solid var(--line);border-radius:14px;transition:all .15s;color:var(--fg);font-size:11.5px;font-weight:700;letter-spacing:.04em}
.home-link:hover{border-color:var(--accent);transform:translateY(-1px)}
.home-link .ic{font-size:20px;line-height:1}
.home-footer{text-align:center;padding:28px 0 8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* ============ FEED ============ */
.feed{position:fixed;inset:0;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{height:100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:var(--safe-top) 0 var(--safe-bottom);overflow:hidden}
.card-inner{flex:1;display:flex;flex-direction:column;padding:60px 22px 80px;max-width:680px;margin:0 auto;width:100%;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--accent));opacity:.9}
.card[data-sec="overview"]{--c:var(--c-overview)}
.card[data-sec="Vocabulary"]{--c:var(--c-vocab)}
.card[data-sec="Matching"]{--c:var(--c-matching)}
.card[data-sec="Gap-fill"]{--c:var(--c-gap)}
.card[data-sec="Grammar"]{--c:var(--c-grammar)}
.card[data-sec="Test"]{--c:var(--c-test)}
.card[data-sec="Passages"]{--c:var(--c-passage)}
.card[data-sec="Reading"]{--c:var(--c-reading)}
.card[data-sec="Writing"]{--c:var(--c-writing)}
.card[data-sec="Wrap"]{--c:var(--c-wrap)}
.card[data-sec="Locked"]{--c:var(--muted)}

/* Typography */
.h-big{font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:16px}
.h-med{font-size:clamp(22px,5.5vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:12px}
.h-sm{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.4;margin-bottom:8px}
.p{font-size:15.5px;line-height:1.6;color:var(--fg-soft)}
.p.fa{font-family:var(--farsi);direction:rtl;text-align:right;font-size:15px;line-height:1.9}
.kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--accent));margin-bottom:14px}
.spacer{flex:1;min-height:20px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1}
.row{display:flex;gap:8px;align-items:center}

/* Section intro */
.section-intro .num{font-size:clamp(72px,20vw,130px);font-weight:800;letter-spacing:-.05em;line-height:1;color:var(--c);margin-bottom:4px;position:relative;display:inline-block}
.section-intro .num.done::after{content:"✓";position:absolute;top:6px;right:-12px;font-size:.35em;color:var(--ok)}
.section-intro .name{font-size:clamp(26px,6.5vw,36px);font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:14px}
.section-intro .desc{font-size:15.5px;line-height:1.6;color:var(--fg-soft);max-width:36ch}
.section-intro .stat{margin-top:20px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Overview */
.overview-hero{padding:8px 0 18px}
.overview-pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:8px;background:var(--c-overview);color:#fff;margin-bottom:12px}
.overview-title{font-size:clamp(24px,6vw,32px);font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:6px}
.overview-fa{font-family:var(--farsi);font-size:14.5px;line-height:1.75;color:var(--fg-soft);direction:rtl;text-align:right;margin-bottom:14px}
.overview-tip{font-size:13.5px;line-height:1.55;color:var(--fg-soft);padding:12px 14px;background:var(--card-2);border-radius:12px;border-left:3px solid var(--c-overview)}
.overview-progress{margin:18px 0 12px}
.overview-progress .row-between{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--fg-soft);margin-bottom:8px}
.overview-progress .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.overview-progress .fill{height:100%;background:var(--c-overview);border-radius:6px;transition:width .4s}
.overview-modules{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.overview-mod{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;transition:all .15s;text-align:left;width:100%}
.overview-mod:not(:disabled):hover{border-color:var(--c-overview);transform:translateX(2px)}
.overview-mod:disabled{opacity:.5;cursor:not-allowed}
.overview-mod .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.05);font-size:14px;flex:0 0 28px}
.overview-mod .info{flex:1;min-width:0}
.overview-mod .title{font-size:14px;font-weight:700;line-height:1.3}
.overview-mod .meta{font-size:11px;color:var(--muted);margin-top:2px}
.overview-mod .badge{font-size:10px;font-weight:800;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--fg-soft);flex-shrink:0}
.overview-mod .badge.done{background:var(--ok-soft);color:var(--ok)}
.overview-mod .badge.active{background:rgba(110,139,255,.14);color:var(--accent)}
.overview-actions{display:flex;gap:8px;margin-top:16px}
.overview-actions .btn{flex:1}

/* Locked */
.locked-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;padding:24px}
.locked-card .ghost{position:absolute;inset:16px;background:var(--card-2);border-radius:16px;filter:blur(8px);opacity:.5}
.locked-card .content{position:relative;z-index:1;max-width:36ch}
.locked-card .lock-ic{font-size:48px;margin-bottom:16px;line-height:1}
.locked-card .lock-title{font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:-.02em}
.locked-card .lock-msg{font-size:14.5px;color:var(--fg-soft);line-height:1.55;margin-bottom:20px}
.locked-card .btn{max-width:280px;width:100%}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:14px;font-size:15px;font-weight:600;transition:transform .1s,opacity .15s,background .15s;min-height:48px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--c,var(--accent));color:#fff}
.btn-primary:hover{opacity:.92}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg)}
[data-theme="light"] .btn-ghost{background:rgba(0,0,0,.04)}
.btn-block{width:100%;max-width:340px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ============ VOCAB — redesigned ============ */
.vocab-count{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vocab-count .bar{flex:1;height:2px;background:var(--line);margin:0 12px;border-radius:2px;overflow:hidden}
.vocab-count .bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.flashcard{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;perspective:1400px;position:relative;min-height:320px}
.flashcard-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 26px;text-align:center;transition:opacity .35s,transform .35s;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--c-vocab) 12%,var(--card)) 0%,var(--card) 60%);box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden;position:absolute}
.flashcard-face::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,color-mix(in srgb,var(--c-vocab) 24%,transparent) 0%,transparent 45%);pointer-events:none}
[data-theme="light"] .flashcard-face{background:linear-gradient(160deg,color-mix(in srgb,var(--c-vocab) 10%,#fff) 0%,#fff 60%);box-shadow:0 12px 40px rgba(0,0,0,.08)}
.flashcard .front,.flashcard .back{transition:opacity .35s,transform .35s}
.flashcard .back{opacity:0;pointer-events:none}
.flashcard.flipped .front{opacity:0;pointer-events:none;transform:scale(.94)}
.flashcard.flipped .back{opacity:1;pointer-events:auto}
.flashcard-face.front .kind-pill{display:none;display:inline-block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--c-vocab) 22%,transparent);color:var(--c-vocab);margin-bottom:22px;position:relative;z-index:1}
.flashcard-face.front .word{font-size:clamp(36px,9vw,54px);font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-bottom:18px;position:relative;z-index:1;max-width:12ch}
.flashcard-face.front .hint{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);position:relative;z-index:1}
.flashcard-face.back .fa-word{font-family:var(--farsi);direction:rtl;font-size:clamp(24px,6vw,32px);font-weight:600;line-height:1.6;margin-bottom:22px;color:var(--fg);position:relative;z-index:1}
.flashcard-face.back .divider{width:60px;height:2px;background:color-mix(in srgb,var(--c-vocab) 40%,transparent);border-radius:2px;margin:0 auto 20px;position:relative;z-index:1}
.flashcard-face.back .ex{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.65;color:var(--fg-soft);max-width:28ch;position:relative;z-index:1}
.vocab-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.speak-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--fg-soft);transition:all .15s;cursor:pointer}
[data-theme="light"] .speak-btn{background:rgba(0,0,0,.03)}
.speak-btn:hover{border-color:var(--c);color:var(--c)}
.speak-btn.speaking{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.speak-btn svg{width:15px;height:15px}

/* Options */
.options{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt{display:block;width:100%;padding:16px 18px;background:var(--card-2);border:1.5px solid var(--line);border-radius:14px;font-size:15px;line-height:1.45;color:var(--fg);transition:all .15s;text-align:left}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.55;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.bad .en{direction:ltr;display:block;text-align:left;margin-top:4px;font-size:13.5px}

/* Matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;flex:1;min-height:0}
.match-col{display:flex;flex-direction:column;gap:8px}
.mitem{padding:14px 12px;background:var(--card-2);border:1.5px solid var(--line);border-radius:12px;font-size:13px;line-height:1.35;text-align:center;transition:all .15s;color:var(--fg)}
.mitem.en{font-weight:600}
.mitem.fa{font-family:var(--farsi);direction:rtl;font-size:13px}
.mitem:hover:not(:disabled){border-color:var(--c)}
.mitem.sel{border-color:var(--c);background:rgba(110,139,255,.12)}
.mitem.matched{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);pointer-events:none;opacity:.72}
.mitem.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* Gap fill */
.gap-sentence{font-family:var(--serif);font-size:clamp(20px,5vw,26px);line-height:1.5;margin:20px 0 24px;letter-spacing:-.01em}
.gap-blank{display:inline-block;min-width:80px;color:var(--c);border-bottom:2px solid var(--c);text-align:center;font-weight:600;margin:0 4px}

/* Grammar teach */
.grammar-teach{direction:rtl;text-align:right;font-family:var(--farsi);font-size:14.5px;line-height:1.95;color:var(--fg);flex:1;overflow-y:auto;padding:4px 0}
.grammar-teach h3{font-family:var(--sans);font-size:18px;font-weight:700;direction:ltr;text-align:left;margin:16px 0 10px;letter-spacing:-.01em}
.grammar-teach h3:first-child{margin-top:0}
.grammar-teach p{margin-bottom:10px}
.grammar-teach .ex{padding:12px 14px;background:rgba(251,191,36,.1);border-left:3px solid var(--c);border-radius:0 8px 8px 0;direction:ltr;text-align:left;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.55;margin:10px 0}
.grammar-teach .err{direction:ltr;text-align:left;padding:12px 14px;background:var(--bad-soft);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;font-size:13px;line-height:1.6;margin:10px 0}
.grammar-teach .err .en{direction:ltr;display:block;margin-top:4px;color:var(--ok)}
.grammar-teach .note{padding:12px 14px;background:var(--card-2);border-radius:8px;font-size:13px;line-height:1.6;color:var(--fg-soft);margin:10px 0}
.grammar-teach table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;direction:ltr}
.grammar-teach th,.grammar-teach td{border:1px solid var(--line);padding:8px 10px;text-align:left}
.grammar-teach th{background:var(--card-2);font-weight:600}
.grammar-teach .hl{background:rgba(251,191,36,.18);padding:1px 5px;border-radius:3px;color:var(--c);font-weight:600}

/* Reading */
.reading-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:2px 0 12px;margin-bottom:10px;scrollbar-width:thin}
.reading-scroll::-webkit-scrollbar{width:3px}
.reading-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}
.reader{font-family:var(--serif);font-size:17px;line-height:1.9;color:var(--fg)}
.reader p{margin-bottom:16px}
.reader p:last-child{margin-bottom:0}
.sent{transition:background .25s;border-radius:6px;padding:1px 2px}
.sent.highlighted{background:color-mix(in srgb,var(--c-reading) 22%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--c-reading) 30%,transparent)}
.w{cursor:pointer;border-radius:4px;padding:1px 3px;transition:background .12s,color .12s}
.w:hover,.w.active{background:rgba(110,139,255,.22)}
.w.hl{background:color-mix(in srgb,var(--c-grammar) 22%,transparent);color:var(--fg);font-weight:600;padding:1px 4px;border-radius:4px;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--c-grammar) 60%,transparent);text-decoration-thickness:2px;text-underline-offset:3px}
.gl{cursor:pointer;padding:1px 4px;border-radius:4px;font-weight:500;transition:all .12s}
.gl.vocab{color:#A78BFA;background:rgba(167,139,250,.1);border-bottom:2px solid rgba(167,139,250,.5)}
.gl.idiom{color:#FBBF24;background:rgba(251,191,36,.1);border-bottom:2px solid rgba(251,191,36,.5)}
.gl.colloc{color:#5EEAD4;background:rgba(94,234,212,.1);border-bottom:2px solid rgba(94,234,212,.5)}
[data-theme="light"] .gl.vocab{color:#7C5CE0;background:rgba(124,92,224,.1)}
[data-theme="light"] .gl.idiom{color:#D97706;background:rgba(217,119,6,.1)}
[data-theme="light"] .gl.colloc{color:#14B8A6;background:rgba(20,184,166,.1)}
.gl:hover,.gl.active{background:rgba(110,139,255,.24)}
.reading-tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;padding-top:8px}
.time-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-soft);margin-bottom:14px}
.time-chip b{color:var(--c)}
[data-theme="light"] .time-chip{background:rgba(0,0,0,.03)}

/* Soft timer (skim/scan) */
.soft-timer{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.soft-timer .bar-wrap{background:var(--line);height:6px;border-radius:4px;overflow:hidden;margin-bottom:6px}
.soft-timer .bar-fill{height:100%;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));border-radius:4px;transition:width .5s linear;width:0%}
.soft-timer .label{font-size:11px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;letter-spacing:.08em;text-transform:uppercase}
.soft-timer .label b{color:var(--c);font-variant-numeric:tabular-nums}
.soft-timer.done .bar-fill{background:var(--ok)}

.scroll-hint{text-align:center;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 0;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-3px);opacity:1}}

/* Writing */
.prompt-card{padding:18px 20px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.prompt-card .label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c);margin-bottom:8px}
.prompt-card p{font-size:15px;line-height:1.55;color:var(--fg)}
textarea.writing{width:100%;flex:1;min-height:120px;padding:14px 16px;background:var(--card-2);border:1.5px solid var(--line);border-radius:14px;font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--fg);resize:none;outline:none;transition:border-color .15s}
textarea.writing:focus{border-color:var(--c)}
textarea.writing::placeholder{color:var(--muted)}
.writing-timer{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.writing-timer .clock{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--c);font-variant-numeric:tabular-nums;min-width:56px}
.writing-timer .lbl{flex:1;font-size:12px;color:var(--muted);font-weight:600}
.writing-timer .btn-mini{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:800;background:var(--c);color:#fff;border:none}
.writing-timer.running{border-color:var(--c)}
.writing-timer.done{border-color:var(--ok);background:var(--ok-soft)}
.writing-timer.done .clock{color:var(--ok)}

/* Wrap */
.wrap-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.wrap-stat{padding:16px 10px;background:var(--card-2);border:1px solid var(--line);border-radius:14px;text-align:center}
.wrap-stat .n{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--c);line-height:1;margin-bottom:6px}
.wrap-stat .l{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ============ SHEET ============ */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.35);transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1),max-height .3s;max-height:60vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:var(--safe-bottom)}
.sheet.show{transform:translateY(0)}
.sheet.expanded{max-height:92vh}
.sheet-handle{width:36px;height:4px;background:var(--line-strong);border-radius:4px;margin:10px auto 6px;flex-shrink:0}
.sheet-head{padding:6px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.sheet-head h3{font-size:16px;font-weight:800;letter-spacing:-.01em}
.sheet-head .toggle{font-size:12px;font-weight:700;padding:6px 12px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;color:var(--fg-soft);transition:all .15s}
[data-theme="light"] .sheet-head .toggle{background:rgba(0,0,0,.04)}
.sheet-head .toggle:hover{border-color:var(--accent);color:var(--accent)}
.sheet-body{padding:0 12px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.sheet-hero{margin-bottom:14px;padding:14px 16px;background:linear-gradient(135deg,rgba(110,139,255,.12),var(--card-2));border-radius:14px}
.sheet-hero .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sheet-hero .t{font-size:15px;font-weight:800;letter-spacing:-.01em}
.sheet-hero .m{font-size:12px;color:var(--fg-soft);margin-top:4px}
.sheet-section{margin-bottom:6px;border-radius:14px;background:var(--card-2);overflow:hidden;border:1px solid transparent;transition:border-color .15s}
.sheet-section.current{border-color:var(--accent)}
.sheet-section.locked{opacity:.55}
.sheet-sec-row{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%}
.sheet-sec-row .dot{width:10px;height:10px;border-radius:50%;background:var(--sec-c,var(--accent));flex-shrink:0}
.sheet-sec-row .name{flex:1;font-size:14px;font-weight:700;text-align:left}
.sheet-sec-row .status{font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet-sec-row .status.done{color:var(--ok)}
.sheet-sec-row .status.active{color:var(--accent)}
.sheet-sec-row .chev{font-size:11px;color:var(--muted);padding:4px 2px;transition:transform .2s;cursor:pointer;background:none;border:none;flex-shrink:0;width:20px;text-align:center}
.sheet-section.open .sheet-sec-row .chev{transform:rotate(180deg)}
.sheet-sec-jump{flex:1;display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.sheet-sec-jump:disabled{cursor:not-allowed}
.sheet-cards{display:none;padding:0 10px 10px}
.sheet-section.open .sheet-cards{display:block}
.sheet-card-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--fg-soft);cursor:pointer;transition:background .12s;width:100%;text-align:left;border:none;background:none;font-family:inherit}
.sheet-card-row:hover{background:rgba(255,255,255,.05);color:var(--fg)}
[data-theme="light"] .sheet-card-row:hover{background:rgba(0,0,0,.04)}
.sheet-card-row.current{background:rgba(110,139,255,.15);color:var(--fg);font-weight:700}
.sheet-card-row .n{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:32px}
.sheet-card-row.current .n{color:var(--accent)}
.sheet-card-row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-locked-row{padding:12px 14px;font-size:12.5px;color:var(--fg-soft);display:flex;align-items:center;gap:10px}
.sheet-locked-row .lock{font-size:14px}

/* ============ INLINE WORD POPUP ============ */
.word-popup{position:fixed;z-index:70;max-width:min(340px,calc(100vw - 24px));padding:12px 14px;background:#F4D35E;color:#1A1A1E;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;font-family:var(--sans);font-size:13px}
.word-popup.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.word-popup b{display:block;font-size:14px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em;line-height:1.3}
.word-popup i{display:block;font-family:var(--farsi);font-style:normal;direction:rtl;text-align:right;font-size:14px;line-height:1.7;color:#4A3B10}
.word-popup .sent-orig{direction:ltr;text-align:left;font-size:12px;line-height:1.5;color:#4A3B10;opacity:.85;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,.15);font-style:italic}
.word-popup .loading{font-size:12px;color:#8B6E1A;font-style:italic}
.word-popup .actions{margin-top:8px;display:flex;gap:6px;justify-content:flex-end}
.word-popup .mini{padding:4px 9px;border-radius:6px;font-size:11px;font-weight:800;background:rgba(0,0,0,.1);color:#1A1A1E;cursor:pointer}
.word-popup .mini:hover{background:rgba(0,0,0,.18)}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal-box{background:var(--card);border-radius:20px;padding:24px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:modalIn .28s ease;max-height:88vh;overflow-y:auto}
@keyframes modalIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.m-icon{font-size:2.6rem;margin-bottom:8px;line-height:1}
.m-title{font-size:1.1rem;font-weight:800;color:var(--accent);margin-bottom:8px}
.m-body{font-size:.88rem;margin-bottom:16px;line-height:1.7;color:var(--fg-soft)}
.m-body b{color:var(--fg)}
.name-input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:1rem;background:var(--card);color:var(--fg);margin-bottom:12px;text-align:center;font-weight:600}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.btn-row .btn{flex:1;min-width:100px}

/* ============ STATS ============ */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat-box .val{font-size:1.25rem;font-weight:800;color:var(--accent)}
.stat-box .lbl{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.skill-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.skill-row:last-child{border-bottom:none}
.skill-row .lbl{flex:1;font-size:13px;font-weight:600}
.skill-row .meta{font-size:11px;color:var(--muted);font-weight:700}
.skill-row .bar{width:60px;height:5px;background:var(--line);border-radius:5px;overflow:hidden}
.skill-row .bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.skill-row .bar i.warn{background:var(--warn)}
.skill-row .bar i.bad{background:var(--bad)}
.srs-card{background:linear-gradient(135deg,rgba(110,139,255,.15),var(--card-2));border:2px solid var(--accent);border-radius:16px;padding:32px 20px;text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;margin-bottom:14px}
.srs-card .front{font-size:1.2rem;font-weight:800;color:var(--accent);line-height:1.4}
.srs-card .back{font-size:1rem;color:var(--fg);line-height:1.6;margin-top:10px}
.srs-card .back .fa{font-family:var(--farsi);color:var(--fg-soft);font-size:.9rem;direction:rtl;margin-top:6px}
.srs-hint{font-size:.75rem;color:var(--muted);margin-top:12px;font-style:italic}
.rate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.rate-btn{padding:11px 4px;border-radius:11px;border:2px solid var(--line);background:var(--card);color:inherit;font-family:inherit;font-weight:800;font-size:.72rem;cursor:pointer;transition:all .15s}
.rate-btn.r0{border-color:var(--bad);color:var(--bad)}
.rate-btn.r1{border-color:var(--warn);color:var(--warn)}
.rate-btn.r2{border-color:var(--accent);color:var(--accent)}
.rate-btn.r3{border-color:var(--ok);color:var(--ok)}
.challenge-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.85rem;gap:10px}
.challenge-item:last-child{border-bottom:none}
.badge{font-size:.68rem;padding:3px 8px;border-radius:9px;font-weight:700}
.badge-high{background:var(--bad-soft);color:var(--bad)}
.badge-low{background:var(--ok-soft);color:var(--ok)}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:12px}
.settings-row:last-child{border-bottom:none}
.settings-row .label{font-size:.9rem;font-weight:600;flex:1}
.settings-row .desc{font-size:.75rem;color:var(--muted);margin-top:2px}
.btn-mini{padding:8px 14px;font-size:.8rem;border-radius:10px;background:var(--accent);color:#fff;border:none;font-family:inherit;font-weight:700;cursor:pointer}
.section-title{font-size:1rem;font-weight:800;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
/* Persistent navigation controls: visible but unobtrusive on every page */
.back-btn,.map-btn{opacity:.58!important;visibility:visible!important;pointer-events:auto!important;transition:opacity .2s,transform .2s;z-index:60}
.back-btn:hover,.map-btn:hover,.back-btn:focus-visible,.map-btn:focus-visible{opacity:1!important}
/* Avoid mandatory snapping to an unintended neighboring card during a quick flick. */
.feed{scroll-snap-type:none!important;scroll-behavior:auto!important}
.flashcard-face.front .word{font-size:clamp(28px,7vw,40px);font-weight:800;line-height:1.22;letter-spacing:-.035em}
.unit-row[aria-expanded="true"] .unit-chevron{transform:rotate(180deg)}
body[data-page="home"] .back-btn,body:not([data-page="lesson"]) .map-btn{display:none!important}
.fb .en{display:block;direction:ltr;text-align:left;font-weight:600}
.fb .fa-ex{display:block;direction:rtl;text-align:right;font-family:var(--farsi);font-weight:400;font-size:14px;line-height:1.8;margin-top:4px}
.fb.fa-hint{white-space:pre-line}
.flashcard:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:22px}
.grammar-teach .en-block{direction:ltr;text-align:justify;font-family:var(--sans)}
.en-block{direction:ltr;text-align:justify;font-family:var(--sans);line-height:1.6}
.tapfind-lines{display:flex;flex-direction:column;gap:8px}
.tf-line{text-align:left;padding:12px 14px;border-radius:14px;background:var(--card-2);border:1.5px solid var(--line);line-height:1.5;font-size:14.5px}
.tf-line.found{background:var(--ok-soft);border-color:var(--ok)}
.reader p{text-align:justify}
.voc-dialogue{margin-top:14px;text-align:left;direction:ltr;font-size:13.5px;line-height:1.6;color:var(--fg-soft);max-height:34vh;overflow-y:auto}
.voc-dialogue p{margin-bottom:8px}
.voc-dialogue .hl{color:var(--accent);font-weight:800}
.voc-colloc{width:100%;text-align:left;direction:ltr;margin-top:6px;max-height:30vh;overflow-y:auto}
.voc-colloc .cc{margin-bottom:12px;font-size:14px}
.voc-colloc .cc b{display:block;color:var(--accent);margin-bottom:2px}
.voc-colloc .cc .en{display:block;font-style:italic;font-size:13px;color:var(--fg-soft)}
.voc-frame{margin-top:10px;font-size:13.5px;text-align:left;direction:ltr;color:var(--fg-soft);border-top:1px solid var(--line);padding-top:10px;width:100%}
.flashcard.rich .flashcard-face{overflow-y:auto;justify-content:flex-start;padding-top:28px}
.flashcard.rich .word{font-size:28px;margin-bottom:4px}
.home::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 55% at 50% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%)}
.home-inner{position:relative;padding-bottom:100px}
.hm-top{display:flex;justify-content:space-between;align-items:center}
.hm-brand{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hm-chip{font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--fg-soft)}
.hm-hello{font-size:clamp(28px,7vw,36px);font-weight:800;letter-spacing:-.03em;margin:18px 0 20px}
.hm-hello span{color:var(--accent)}
.hm-hero{display:flex;align-items:center;gap:16px;width:100%;padding:18px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 28%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:0 14px 40px rgba(0,0,0,.25);margin-bottom:22px}
.hm-ring{position:relative;width:64px;height:64px;flex:0 0 64px}
.hm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.hm-ring circle{fill:none;stroke-width:5}
.hm-ring .bg{stroke:var(--line-strong)}
.hm-ring .fg{stroke:var(--accent);stroke-linecap:round}
.hm-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
.hm-hero-t{flex:1;min-width:0}
.hm-hero-t .k{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.hm-hero-t .t{font-size:16px;font-weight:700;line-height:1.3}
.hm-hero-t .s{font-family:var(--farsi);font-size:12.5px;color:var(--fg-soft);margin-top:2px}
.hm-go{font-size:22px;color:var(--accent)}
.hm-count{font-size:12px;font-weight:700;color:var(--muted)}
.hm-path{padding:4px 0 8px}
.hm-node{display:flex;align-items:center;gap:14px;width:100%;padding:9px 2px;position:relative}
.hm-node+.hm-node::before{content:"";position:absolute;left:23px;top:-50%;height:100%;width:2px;background:var(--line-strong)}
.hm-node .dot{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--card);border:2px solid var(--line-strong);color:var(--fg-soft)}
.hm-node.done .dot{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.hm-node.now .dot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}
.hm-node.lock{opacity:.5}
.hm-node .tx{display:flex;flex-direction:column;min-width:0}
.hm-node .tt{font-size:14.5px;font-weight:600;line-height:1.3}
.hm-node .fa{font-family:var(--farsi);font-size:12px;color:var(--muted)}
.hm-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-bottom));display:flex;gap:4px;padding:6px;border-radius:22px;background:var(--card);border:1px solid var(--line);z-index:45;width:min(92vw,420px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.hm-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:16px;font-size:18px;color:var(--fg-soft);text-align:center}
.hm-nav button span{font-size:10.5px;font-weight:700}
.hm-nav button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.sess-bar{position:fixed;left:64px;right:64px;top:calc(30px + var(--safe-top));height:8px;border-radius:8px;background:var(--line-strong);z-index:34;display:none;overflow:hidden}
.sess-bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--accent);transition:width .35s}
body[data-page="lesson"][data-mode="session"] .sess-bar{display:block}
body[data-mode="session"] .hud{display:none}
.next-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-bottom));width:min(90vw,420px);height:50px;border-radius:16px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;display:none;align-items:center;justify-content:center;z-index:34;box-shadow:0 8px 24px rgba(0,0,0,.3)}
body[data-page="lesson"] .next-btn{display:flex}
.opt.sel,.opt.sel:disabled{border-color:var(--accent);background:rgba(110,139,255,.16);opacity:1}
.pth-stage{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:24px 0 6px}
.pth-bar{height:8px;border-radius:8px;background:var(--line-strong);margin:14px 0 4px;overflow:hidden}
.pth-bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.pth-fa{font-family:var(--farsi);color:var(--fg-soft);font-size:14px}
.pn-go{margin-left:auto;font-size:12px;font-weight:800;color:#fff;background:var(--accent);padding:6px 12px;border-radius:999px}
.pn-go.dim{background:var(--card);color:var(--muted);border:1px solid var(--line)}
</style>
</head>
<body>

<div class="home" id="home"><div class="home-inner" id="homeInner"></div></div>
<div class="home hidden" id="pathPage"><div class="home-inner" id="pathInner"></div></div>
<div class="feed hidden" id="feed"></div>

<button class="back-btn" id="backBtn" aria-label="Back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
</button>
<button class="map-btn" id="mapBtn" aria-label="Lesson map">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0 0 21 18.382V7.618a1 1 0 0 0-1.447-.894L15 7m0 13V7"/></svg>
</button>

<div class="hud" id="hud"><span class="num"><b id="hudNum">1</b> / <span id="hudTotal">1</span></span><div class="hud-bar"><i id="hudBar"></i></div><span class="hud-pct" id="hudPct">0%</span></div>

<div class="sess-bar"><i id="sessFill"></i></div>
<button class="next-btn" id="nextBtn">Continue ›</button>
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3>Lesson map</h3>
    <button class="toggle" id="sheetToggle">Show all cards</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="word-popup" id="wordPopup"></div>
<div class="modal-overlay" id="modal"><div class="modal-box" id="modalBox"></div></div>

<script src="lessons.js"></script>
<script>
/* ============================================================
   LESSON DATA
   ============================================================ */
const TEACHER_PASSWORD="BLASTER99";

/* Defensive storage + JSON parsing: mobile browsers may retain malformed or unavailable storage. */
const storage={
  getItem(k){try{return window.localStorage.getItem(k);}catch(e){return null;}},
  setItem(k,v){try{window.localStorage.setItem(k,v);return true;}catch(e){return false;}},
  removeItem(k){try{window.localStorage.removeItem(k);}catch(e){}}
};
function safeJSON(raw,fallback){if(raw==null||raw==="")return fallback;try{const v=JSON.parse(raw);return v&&typeof v==="object"?v:fallback;}catch(e){return fallback;}}

/* ============================================================
   STATE
   ============================================================ */
let progress=safeJSON(storage.getItem("ts3_progress"),{});
let srs=safeJSON(storage.getItem("ts3_srs"),[]);
let metrics=safeJSON(storage.getItem("ts3_metrics"),{});
let lessonXP=safeJSON(storage.getItem("ts3_lesson_xp"),{});
let activityLog=safeJSON(storage.getItem("ts3_activity_log"),[]);
let timeSpent=safeJSON(storage.getItem("ts3_time"),{"learn":0,"practice":0,"progress":0,"settings":0});
let timeDays=safeJSON(storage.getItem("ts3_time_days"),{});
let userName=storage.getItem("ts3_name")||"";
let soundOn=storage.getItem("ts3_sound")!=="0";
let theme=storage.getItem("ts3_theme")||"dark";
let teacherMode=storage.getItem("ts3_teacher_mode")==="1";
let teacherUnlocked=safeJSON(storage.getItem("ts3_teacher_unlocked"),{});
document.documentElement.setAttribute("data-theme",theme);

const S={
  page:"home",
  lesson:null, cards:[], activeIdx:0,
  flipped:new Set(), answers:{}, currentSection:"Overview",
  writeTimer:null, writeStartedAt:null,
  lastSpokenIdx:-1,
  activeSpeakBtn:null,
  chromeHideTimer:null
};

/* speaking state */
let currentUtterance=null;
let isSpeaking=false;

/* ============================================================
   HELPERS
   ============================================================ */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escAttr=s=>esc(s).replace(/"/g,"&quot;");
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function saveP(){storage.setItem("ts3_progress",JSON.stringify(progress));}
function saveS(){storage.setItem("ts3_srs",JSON.stringify(srs));}
function saveM(){storage.setItem("ts3_metrics",JSON.stringify(metrics));storage.setItem("ts3_lesson_xp",JSON.stringify(lessonXP));storage.setItem("ts3_activity_log",JSON.stringify(activityLog.slice(-800)));}
function saveT(){storage.setItem("ts3_time",JSON.stringify(timeSpent));storage.setItem("ts3_time_days",JSON.stringify(timeDays));}
function markDone(k){const isNew=!progress[k];progress[k]=true;saveP();return isNew;}
function checkGrammarDone(){const G=LESSONS[S.lesson].grammar;if(!G||(G.testSets||[]).length)return;if(S.cards.filter(x=>x.type==="grammar-check").every(gc=>{const el=$(`#feed .card[data-idx="${gc._i}"]`);return el&&el.querySelector(".opt:disabled");}))markDone(S.lesson+"_grammar");}
function syncVocab(){const k=S.lesson+"_";if(progress[k+"vocab_flash"]&&progress[k+"vocab_match"]&&progress[k+"vocab_gap"])markDone(k+"vocab");}
function checkGapDone(){if(S.cards.filter(x=>x.type==="gap").every(gc=>{const el=$(`#feed .card[data-idx="${gc._i}"]`);return el&&el.querySelector(".opt:disabled");})){markDone(S.lesson+"_vocab_gap");syncVocab();}}
function bumpMetric(k,n=1,meta={}){metrics[k]=(metrics[k]||0)+n;activityLog.push({kind:k,n,lesson:S.lesson,at:Date.now(),...meta});saveM();}
function awardXP(n,reason){lessonXP[S.lesson]=(lessonXP[S.lesson]||0)+n;bumpMetric("xp",n,{reason});}
function logErr(t,detail){metrics["err_items"]=metrics["err_items"]||[];metrics["err_items"].unshift({...detail,category:t,at:Date.now(),lesson:S.lesson});metrics["err_items"]=metrics["err_items"].slice(0,40);saveM();}
function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function recordTime(ms){if(ms<=0||!isFinite(ms))return;const k=dayKey();timeDays[k]=(timeDays[k]||0)+ms;saveT();}
function fmtTime(ms){const s=Math.floor(ms/1000);if(s<60)return s+"s";const m=Math.floor(s/60);if(m<60)return m+"m";return Math.floor(m/60)+"h "+(m%60)+"m";}
function fmtDateShort(ts){return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"});}

function periodStats(days){
  const cutoff=Date.now()-days*86400000;
  const ev=activityLog.filter(x=>x.at>=cutoff);
  return {
    newVocab:ev.filter(x=>x.kind==="newVocab").reduce((a,x)=>a+x.n,0),
    reviewed:ev.filter(x=>x.kind==="review").reduce((a,x)=>a+x.n,0),
    answered:ev.filter(x=>x.kind==="answered").reduce((a,x)=>a+x.n,0),
    correct:ev.filter(x=>x.kind==="correct").reduce((a,x)=>a+x.n,0),
    xp:ev.filter(x=>x.kind==="xp").reduce((a,x)=>a+x.n,0),
    lessons:new Set(ev.map(x=>x.lesson).filter(Boolean)).size,
    grammar:[...new Set(ev.filter(x=>x.topic).map(x=>x.topic).filter(Boolean))]
  };
}
function skillStats(skill){
  const ev=activityLog.filter(x=>x.skill===skill);
  const answered=ev.filter(x=>x.kind==="answered").reduce((a,x)=>a+x.n,0);
  const correct=ev.filter(x=>x.kind==="correct").reduce((a,x)=>a+x.n,0);
  return {answered,correct,accuracy:answered?Math.round(correct/answered*100):null};
}

/* sounds */
let _ac=null;
function tone(f1,f2,d,vol=.06){if(!soundOn)return;try{if(!_ac)_ac=new (window.AudioContext||window.webkitAudioContext)();if(_ac.state==="suspended")_ac.resume();const o=_ac.createOscillator(),g=_ac.createGain();o.connect(g);g.connect(_ac.destination);o.frequency.value=f1;g.gain.value=vol;o.start();if(f2)o.frequency.setValueAtTime(f2,_ac.currentTime+d*.4);g.gain.exponentialRampToValueAtTime(.001,_ac.currentTime+d);o.stop(_ac.currentTime+d);}catch(e){}}
function sClick(){tone(600,null,.04,.03);}
function sOK(){tone(820,1100,.2);}
function sBad(){tone(280,170,.22);}
function sChime(){tone(523,659,.1,.05);setTimeout(()=>tone(659,784,.16,.04),100);}

/* TTS with stop tracking */
function speak(t, btnEl){
  if(!("speechSynthesis"in window))return;
  try{window.speechSynthesis.cancel();}catch(e){}
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US"; u.rate=.9;
  u.onend=()=>{if(currentUtterance!==u)return;isSpeaking=false;if(S.activeSpeakBtn){S.activeSpeakBtn.classList.remove("speaking");S.activeSpeakBtn=null;}};
  u.onerror=()=>{if(currentUtterance!==u)return;isSpeaking=false;if(S.activeSpeakBtn){S.activeSpeakBtn.classList.remove("speaking");S.activeSpeakBtn=null;}};
  currentUtterance=u;
  isSpeaking=true;
  if(btnEl){if(S.activeSpeakBtn)S.activeSpeakBtn.classList.remove("speaking");btnEl.classList.add("speaking");S.activeSpeakBtn=btnEl;}
  try{window.speechSynthesis.speak(u);}catch(e){isSpeaking=false;}
}
function stopSpeak(){
  try{window.speechSynthesis.cancel();}catch(e){}
  isSpeaking=false;
  if(S.activeSpeakBtn){S.activeSpeakBtn.classList.remove("speaking");S.activeSpeakBtn=null;}
  currentUtterance=null;
}

/* ============================================================
   UNLOCK LOGIC
   ============================================================ */
function isLessonComplete(id){const L=LESSONS[id];if(!L||!L.ready)return false;if(L.sessions)return L.sessions.every(x=>progress[id+"_s_"+x.id]);
  return ["vocab",...(L.grammar?["grammar"]:[]),"reading","writing"].every(k=>progress[id+"_"+k]);}
function isUnlocked(id){return true;}
function moduleUnlocked(mod){
  if(teacherMode)return true;
  const L=LESSONS[S.lesson]; if(!L||!L.ready)return false;
  return true; /* Once a lesson is available, all of its sections are available. */
  /* Retained below for compatibility with older progression states. */
  const seq=["vocab"]; if(L.grammar)seq.push("grammar"); seq.push("reading","writing");
  const i=seq.indexOf(mod); if(i<=0)return true;
  const prev=seq[i-1];
  if(prev==="vocab")return progress[S.lesson+"_vocab_match"]&&progress[S.lesson+"_vocab_gap"];
  if(prev==="grammar")return progress[S.lesson+"_grammar"];
  if(prev==="reading")return progress[S.lesson+"_reading"];
  return false;
}
function firstIncompleteModule(){
  const L=LESSONS[S.lesson]; if(!L||!L.ready)return null;
  if(!progress[S.lesson+"_vocab"])return "vocab";
  if(L.grammar&&!progress[S.lesson+"_grammar"])return "grammar";
  if(!progress[S.lesson+"_reading"])return "reading";
  if(!progress[S.lesson+"_writing"])return "writing";
  return null;
}

/* ============================================================
   FEED BUILDER
   ============================================================ */
function buildFeed(id){
  const L=LESSONS[id]; if(!L||!L.ready)return [];
  const cards=[];
  const push=(c)=>cards.push({...c,_i:cards.length});

  push({type:"overview",section:"Overview"});

  push({type:"section-intro",section:"Vocabulary",num:"01",name:"Vocabulary",desc:`${L.vocab.length} expressions to learn. Tap a card to flip it, or turn on Auto-reveal.`,count:L.vocab.length});
  L.vocab.forEach((v,i)=>push({type:"vocab",section:"Vocabulary",idx:i,total:L.vocab.length,word:v[0],fa:v[2],ex:v[3],kind:v[1]}));

  push({type:"section-intro",section:"Matching",num:"02",name:"Matching",desc:"Connect each expression with its meaning. Short sets of five.",count:2});
  for(let s=0;s*5<L.vocab.length;s++)push({type:"matching",section:"Matching",set:s+1,sets:Math.ceil(L.vocab.length/5),pairs:L.vocab.slice(s*5,s*5+5)});

  push({type:"section-intro",section:"Gap-fill",num:"03",name:"Gap-fill",desc:"Fill in the missing expression. Ten questions in context.",count:10});
  const gaps=buildGapfill(L).slice(0,10);
  gaps.forEach((q,i)=>push({type:"gap",section:"Gap-fill",idx:i,total:gaps.length,...q}));

  if(L.grammar){
    push({type:"section-intro",section:"Grammar",num:"04",name:"Grammar",desc:`${L.grammar.points.length} points. Read the Farsi explanation, then check yourself.`,count:L.grammar.points.length*2});
    L.grammar.points.forEach((g,i)=>{
      push({type:"grammar-teach",section:"Grammar",idx:i,total:L.grammar.points.length,title:g.title,body:g.html});
      g.qs.forEach((q,qi)=>push({type:"grammar-check",section:"Grammar",idx:i,qIdx:qi,topic:g.title,...q}));
    });
  }

  if(L.grammar&&(L.grammar.testSets||[]).length){
    const allQ=L.grammar.testSets.flatMap(s=>s.qs);
    push({type:"section-intro",section:"Test",num:"05",name:"Test",desc:`${allQ.length} questions. One per card. Score 70% to complete Grammar.`,count:allQ.length});
    allQ.forEach((q,i)=>push({type:"test-q",section:"Test",idx:i,total:allQ.length,...q}));
  }

  if(L.grammar&&L.grammar.passages&&L.grammar.passages.length){
    push({type:"section-intro",section:"Passages",num:"06",name:"Passages",desc:"Read each passage, then retell it in your own words using the keywords.",count:L.grammar.passages.length});
    L.grammar.passages.forEach((p,i)=>push({type:"passage",section:"Passages",idx:i,...p}));
  }

  if(moduleUnlocked("reading")||progress[id+"_reading"]){
    push({type:"section-intro",section:"Reading",num:"07",name:"Reading",desc:"Two articles. Skim, scan, then read carefully. Tap words for meaning.",count:L.texts.length});
    L.texts.forEach((t,i)=>{
      push({type:"reading-skim",section:"Reading",idx:i,...t});
      push({type:"reading-scan",section:"Reading",idx:i,...t});
      push({type:"reading-full",section:"Reading",idx:i,...t});
      for(let qi=1;qi<(t.detailed||[]).length;qi++)push({type:"reading-scan",section:"Reading",idx:i,qi,...t});
    });
  } else {
    push({type:"locked-placeholder",section:"Locked",target:"Reading",prereq:"Grammar"});
  }

  if(moduleUnlocked("writing")||progress[id+"_writing"]){
    push({type:"section-intro",section:"Writing",num:"08",name:"Writing",desc:"Two prompts. Write a response and check the sample.",count:L.writing.prompts.length});
    L.writing.prompts.forEach((p,i)=>push({type:"writing",section:"Writing",idx:i,...p}));
  } else {
    push({type:"locked-placeholder",section:"Locked",target:"Writing",prereq:"Reading"});
  }

  cards.forEach(c=>{if(c.type==="section-intro")c.count=cards.filter(x=>x.section===c.section&&x.type!=="section-intro").length;});
  push({type:"wrap",section:"Wrap"});
  return cards;
}

function buildGapfill(lessonData){
  const v0=(lessonData&&lessonData.vocab)||[], v=v0.map(vocNorm), out=[];
  const overrides=(lessonData&&lessonData.gapOverrides)||[];
  overrides.forEach(q=>{const o=shuffle(q.o);out.push({...q,o,a:o.indexOf(q.correct)});});
  const used=new Set(out.map(x=>x.correct));
  for(const item of shuffle(v)){
    if(out.length>=10||used.has(item.word))continue;
    const phrase=item.word, sentence=item.ex;
    if(!sentence)continue;
    const re=new RegExp("(^|[^A-Za-z])"+phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"(?=$|[^A-Za-z])","i");
    if(!re.test(sentence))continue;
    used.add(phrase);
    const blanked=sentence.replace(re,(m,p1)=>p1+"_____");
    const picks=shuffle(v.filter(x=>x.word!==phrase)).slice(0,3).map(x=>x.word);
    const o=shuffle([phrase,...picks]);
    out.push({s:blanked,o,a:o.indexOf(phrase),correct:phrase});
  }
  return out;
}

/* ============================================================
   CARD RENDERERS
   ============================================================ */
function renderCard(c){
  if(c.type==="overview")return renderOverview(c);
  if(c.type==="section-intro")return renderSectionIntro(c);
  if(c.type==="locked-placeholder")return renderLocked(c);
  if(c.type==="vocab")return renderVocab(c);
  if(c.type==="matching")return renderMatching(c);
  if(c.type==="gap")return renderGap(c);
  if(c.type==="grammar-teach")return renderGrammarTeach(c);
  if(c.type==="grammar-check")return renderGrammarCheck(c);
  if(c.type==="test-q")return renderTestQ(c);
  if(c.type==="passage")return renderPassage(c);
  if(c.type==="reading-skim")return renderReadingSkim(c);
  if(c.type==="reading-scan")return renderReadingScan(c);
  if(c.type==="reading-full")return renderReadingFull(c);
  if(c.type==="writing")return renderWriting(c);
  if(c.type==="wrap")return renderWrap(c);
  if(c.type==="quiz-q")return renderQuizQ(c);
  if(c.type==="context")return renderContext(c);
  if(c.type==="selfcheck")return renderSelfcheck(c);
  if(c.type==="convo")return renderConvo(c);
  if(c.type==="tapfind")return renderTapfind(c);
  if(c.type==="writing-sample")return renderWritingSample(c);
  if(c.type==="cp-q")return renderCpQ(c);
  if(c.type==="cp-result")return renderCpResult(c);
  if(c.type==="quiz-result")return renderQuizResult(c);
  if(c.type==="session-done")return renderSessionDone(c);
  return "";
}

/* ============================================================
   SESSIONS (Version 1) — short study chunks built from lesson parts
   ============================================================ */
function posKey(){return "ts3_feed_pos_"+S.lesson+(S.sess?"_"+S.sess.id:"");}
function vocNorm(v){
  if(Array.isArray(v))return {word:v[0],kind:v[1],fa:v[2],ex:v[3]};
  const ex=(v.colloc&&v.colloc[0]&&v.colloc[0].ex)||"";
  return {word:v.word,kind:"vocab",fa:v.fa,ex,rich:v};
}
function buildSession(id,sess){
  const L=LESSONS[id],cards=[],push=c=>cards.push({...c,_i:cards.length});
  sess.parts.forEach(p=>{
    if(p.t==="quiz"){L.quiz.forEach((q,i)=>push({type:"quiz-q",section:"Getting started",idx:i,total:L.quiz.length,...q}));push({type:"quiz-result",section:"Getting started"});}
    else if(p.t==="circle")L.circle.forEach((q,i)=>push({type:"grammar-check",section:"Grammar",idx:i,kicker:`Circle the correct word · ${i+1} of ${L.circle.length}`,topic:"Circle the correct words",...q}));

/* ============================================================
   RICH TEXT — sentence-wrapped, all words tappable
   ============================================================ */
function richText(text,glossary,hlList){
  glossary=glossary||{}; hlList=(hlList||[]).map(h=>h.toLowerCase());
  const sentences=(text.match(/[^.!?]+(?:[.!?]+["')\]]*)?\s*/g)||[text]).map(s=>s.trim()).filter(Boolean);
  return sentences.map(sent=>{
    const rendered=renderSentence(sent,glossary,hlList);
    return `<span class="sent" data-sent="${escAttr(sent.trim())}">${rendered}</span>`;
  }).join(" ");
}
function renderSentence(sent,glossary,hlList){
  const keys=Object.keys(glossary).sort((a,b)=>b.length-a.length);
  const used=[],matches=[];
  keys.forEach(key=>{
    const re=new RegExp("(^|[^A-Za-z])("+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")(?=$|[^A-Za-z])","gi");
    let m;
    while((m=re.exec(sent))!==null){
      const start=m.index+m[1].length,end=start+m[2].length;
      if(used.some(r=>!(end<=r.start||start>=r.end)))continue;
      matches.push({start,end,key:m[2],fa:glossary[key].fa,type:glossary[key].type||"vocab"});
      used.push({start,end});
    }
  });
  matches.sort((a,b)=>a.start-b.start);
  let out="",pos=0;
  matches.forEach(m=>{
    out+=wrapWords(esc(sent.slice(pos,m.start)),hlList);
    out+='<span class="gl '+m.type+'" data-word="'+escAttr(m.key)+'" data-fa="'+escAttr(m.fa)+'" data-kind="phrase">'+esc(m.key)+'</span>';
    pos=m.end;
  });
  out+=wrapWords(esc(sent.slice(pos)),hlList);
  return out;
}
function wrapWords(html,hl){
  return html.replace(/([A-Za-z][A-Za-z'\-]*)/g,match=>{
    const clean=match.replace(/[^A-Za-z'\-]/g,"").toLowerCase();
    const isHL=hl.includes(clean);
    return '<span class="w'+(isHL?' hl':'')+'" data-word="'+escAttr(match.replace(/[^A-Za-z'\-]/g,""))+'" data-kind="word">'+match+'</span>';
  });
}

/* ============================================================
   DICTIONARY LOOKUP (cache + MyMemory API)
   ============================================================ */
let dictCache=safeJSON(storage.getItem("ts3_dict_cache"),{});
function saveDict(){storage.setItem("ts3_dict_cache",JSON.stringify(dictCache));}
async function lookupWord(word){
  const key=String(word||"").toLowerCase().trim();
  if(!key)return "";
  // 1. Try lesson glossary first
  const local=localWordMeaning(key);
  if(local)return local;
  // 2. Cache
  if(dictCache[key])return dictCache[key];
  // 3. API
  try{
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(key)}&langpair=en|fa`,{cache:"no-store"});
    const d=await r.json();
    const val=String(d?.responseData?.translatedText||"").trim();
    if(val&&val.toLowerCase()!==key&&!/MYMEMORY|INVALID|QUERY LENGTH/i.test(val)){dictCache[key]=val;saveDict();return val;}
  }catch(e){}
  return "";
}
function localWordMeaning(word){
  const L=LESSONS[S.lesson]; if(!L)return "";
  const key=String(word||"").toLowerCase().replace(/[^a-z'-]/g,"");
  if(!key)return "";
  if(typeof WORDS!=="undefined"){for(const k of [key,key.replace(/(ing|ed|es|s|d)$/,"")])if(WORDS[k])return WORDS[k];}
  // vocab
  for(const v of (L.vocab||[])){
    if(String(v[0]).toLowerCase()===key)return v[2];
  }
  // glossaries in passages and texts
  const sources=[...(L.grammar?.passages||[]),...(L.texts||[])];
  for(const p of sources){
    for(const [k,val] of Object.entries(p.glossary||{})){
      if(k.toLowerCase()===key)return val.fa;
    }
  }
  return "";
}

let popupTimer=null;
function showInlinePopup(anchorEl,html,extraClass){
  const popup=$("#wordPopup");
  popup.className="word-popup"+(extraClass?" "+extraClass:"");
  popup.innerHTML=html;
  popup.style.top="0px";
  popup.style.left="0px";
  popup.classList.add("show");
  // measure
  const rect=anchorEl.getBoundingClientRect();
  const popupRect=popup.getBoundingClientRect();
  let left=rect.left+rect.width/2-popupRect.width/2;
  left=Math.max(8,Math.min(window.innerWidth-popupRect.width-8,left));
  let top=rect.top-popupRect.height-10;
  if(top<70)top=rect.bottom+10;
  popup.style.left=left+"px";
  popup.style.top=top+"px";
  clearTimeout(popupTimer);
  popupTimer=setTimeout(hidePopup,10000);
}
function hidePopup(){$("#wordPopup").classList.remove("show");}

  popup.querySelector("[data-popup-add]").onclick=e=>{

  const html=`

      const el=document.getElementById("popupMeaning");
      if(el)el.textContent=val||"Translation unavailable offline.";
    });

}
async function lookupSentence(sent){
  const key="sentence::"+sent.slice(0,80);
  if(dictCache[key])return dictCache[key];
  try{
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(sent)}&langpair=en|fa`,{cache:"no-store"});
    const d=await r.json();
    const val=String(d?.responseData?.translatedText||"").trim();
    if(val&&!/MYMEMORY|INVALID|QUERY LENGTH/i.test(val)){dictCache[key]=val;saveDict();return val;}
  }catch(e){}
  return "";
}

function renderHome(){

function openLesson(id){
  if(!LESSONS[id]||!LESSONS[id].ready)return;
  S.lesson=id;
  if(LESSONS[id].sessions){S.sess=null;storage.setItem("ts3_last_lesson",id);showPage("path");return;}
  S.sess=null;document.body.dataset.mode="feed";
  S.testRes={};S.answers={};S.cards=buildFeed(id);
  S.flipped=new Set();
  S.activeIdx=0;
  S.lastSpokenIdx=-1;
  storage.setItem("ts3_last_lesson",id);
  $("#feed").innerHTML=S.cards.map(c=>renderCard(c)).join("");
  $("#hudTotal").textContent=S.cards.length;
  bindFeed();
  showPage("lesson");
  requestAnimationFrame(()=>{setupObserver();});

  if(pos>0&&pos<S.cards.length){
    requestAnimationFrame(()=>{const el=$(`#feed .card[data-idx="${pos}"]`);if(el)el.scrollIntoView({behavior:"auto",block:"start"});});
  } else {

  }

}

function trackStreak(correct){
  if(correct){S.streak=(S.streak||0)+1;if(S.streak===5||S.streak===10||(S.streak>10&&S.streak%10===0))sayEncouragement(S.streak);}
  else S.streak=0;
}
function sayEncouragement(n){
  const five=["Nice — five in a row.","You're on a roll.","Five correct in a row.","Great streak going."];
  const ten=["Ten in a row — excellent.","Amazing streak.","Ten correct in a row. Keep going."];
  const msg=(n>=10?ten:five)[Math.floor(Math.random()*(n>=10?ten.length:five.length))];
  try{if(!isSpeaking){const u=new SpeechSynthesisUtterance(msg);u.lang="en-US";u.rate=1;speechSynthesis.speak(u);}}catch(e){}
}
function unanswered(){
  return S.cards.filter(c=>{const el=$(`#feed .card[data-idx="${c._i}"]`);if(!el)return false;
    if(c.type==="matching")return !!el.querySelector(".mitem:not(.matched)");
    return QTYPES.has(c.type)&&!el.querySelector(".opt:disabled");});
}
function reindexFeed(){
  const feed=$("#feed");
  [...feed.children].forEach((el,i)=>{el.dataset.idx=i;if(S.cards[i])S.cards[i]._i=i;});
}
function bindTestQEl(el,c){
  const card=el.closest(".card");let ans=false;
  el.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click",()=>{
      if(ans)return; ans=true;
      const choice=+b.dataset.i,ok=choice===c.a;
      el.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.i===c.a)o.classList.add("correct");if(+o.dataset.i===choice&&choice!==c.a)o.classList.add("wrong");});
      const fb=card.querySelector(".fb");
      bumpMetric("answered",1,{skill:"grammar_test"});trackStreak(ok);
      const QB=S.quizBatch=S.quizBatch||{wrong:[],total:0,correct:0};
      if(!c.retry)QB.total++;
      if(ok){
        fb.className="fb show ok";fb.textContent="Correct.";sOK();
        bumpMetric("correct",1,{skill:"grammar_test"});awardXP(10,"test");
        if(!c.retry)QB.correct++;
        autoAdvance(card);
      } else {
        fb.className="fb show bad";
        fb.innerHTML=`<span class="en">Answer: <b>${esc(c.o[c.a])}</b><br><span class="fa-ex">${esc(c.ex||"")}</span></span>`;
        sBad();logErr("test",{prompt:c.q,answer:c.o[c.a]});
        QB.wrong.push({q:c.q,o:c.o,a:c.a,ex:c.ex});
      }
      if(c.isLastOfBatch){
        if(QB.wrong.length){
          const batch=QB.wrong.splice(0,QB.wrong.length);
          const startIdx=+card.dataset.idx+1;
          const objs=batch.map((wq,k)=>({type:"test-q",section:c.section,idx:k,total:batch.length,retry:true,isLastOfBatch:k===batch.length-1,_i:startIdx+k,...wq}));
          S.cards.splice(startIdx,0,...objs);
          card.insertAdjacentHTML("afterend",objs.map(renderCard).join(""));
          reindexFeed();
          objs.forEach(nc=>{
            const idx=S.cards.indexOf(nc),elx=$(`#feed .card[data-idx="${idx}"]`);
            if(elx)bindTestQEl(elx.querySelector("[data-test]"),S.cards[idx]);
          });
          $("#hudTotal").textContent=S.cards.length;
          fb.insertAdjacentHTML("beforeend",`<span class="en" style="margin-top:8px">Score so far: ${QB.correct}/${QB.total} — let's redo the ${batch.length} you missed.</span>`);
          setTimeout(()=>{const nx=$(`#feed .card[data-idx="${startIdx}"]`);if(nx&&S.activeIdx===+card.dataset.idx)nx.scrollIntoView({behavior:"smooth",block:"start"});},700);
        } else {
          markDone(S.lesson+"_g_test");markDone(S.lesson+"_grammar");
          const pc=Math.round(QB.correct/QB.total*100);
          fb.insertAdjacentHTML("beforeend",`<span class="en" style="margin-top:8px">Score: ${QB.correct}/${QB.total} (${pc}%) — all done ✓</span>`);
        }

  });
}
function bindGrammarCheckEl(el,c){
  const card=el.closest(".card");let ans=false;
  el.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click",()=>{
      if(ans)return; ans=true;
      const choice=+b.dataset.i;
      el.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(+o.dataset.i===c.a)o.classList.add("correct");if(+o.dataset.i===choice&&choice!==c.a)o.classList.add("wrong");});
      const fb=card.querySelector(".fb");
      bumpMetric("answered",1,{skill:"grammar_check",topic:c.topic});setTimeout(checkGrammarDone,0);
      const ok=choice===c.a;trackStreak(ok);trackGrammarWrong(c,ok);
      if(ok){fb.className="fb show ok";fb.innerHTML='<span class="en">Correct.</span><span class="fa-ex">'+esc(c.ex||"")+"</span>";sOK();bumpMetric("correct",1,{skill:"grammar_check",topic:c.topic});awardXP(8,"grammar");autoAdvance(card);}
      else{fb.className="fb show bad";fb.innerHTML=`<span class="en">Answer: <b>${esc(c.o[c.a])}</b><br><span class="fa-ex">${esc(c.ex||"")}</span></span>`;sBad();logErr("grammar",{prompt:c.q,answer:c.o[c.a]});}
    });
  });
  tapifyExtras(card);
}
function trackGrammarWrong(c,correct){
  if(!c.pointKey||c.remedial)return;
  S.remedial=S.remedial||{};
  const r=S.remedial[c.pointKey]=S.remedial[c.pointKey]||{n:0,wrong:0,injected:false};
  r.n++;if(!correct)r.wrong++;
  if(r.n===2&&r.wrong===2&&!r.injected){r.injected=true;injectRemediation(c);}
}
function injectRemediation(c){
  const g=c.pointRef;if(!g)return;
  const startEl=$(`#feed .card[data-idx="${c._i}"]`);if(!startEl)return;
  const qs=((g.qs2&&g.qs2.length)?g.qs2:g.qs).slice(0,2);
  const teach={type:"grammar-teach",section:c.section,idx:0,total:1,title:g.title,body:g.html,kicker:"Review — same explanation",remedial:true};
  const checks=qs.map((q,qi)=>({type:"grammar-check",section:c.section,idx:0,qIdx:qi,topic:g.title,remedial:true,kicker:`Review question ${qi+1} of 2`,...q}));
  const objs=[teach,...checks].map((nc,k)=>({...nc,_i:c._i+1+k}));
  S.cards.splice(c._i+1,0,...objs);
  startEl.insertAdjacentHTML("afterend",objs.map(renderCard).join(""));
  reindexFeed();
  objs.forEach(nc=>{
    const idx=S.cards.indexOf(nc),el=$(`#feed .card[data-idx="${idx}"]`);
    if(!el)return;
    if(nc.type==="grammar-check")bindGrammarCheckEl(el.querySelector("[data-gcheck]"),S.cards[idx]);
    else tapifyExtras(el);
  });
  $("#hudTotal").textContent=S.cards.length;
  sChime();
  setTimeout(()=>{const el=$(`#feed .card[data-idx="${c._i+1}"]`);if(el&&S.activeIdx===c._i)el.scrollIntoView({behavior:"smooth",block:"start"});},700);
}
function autoAdvance(cardEl, delay=900){
  const idx=+cardEl.dataset.idx;
  let next;
  if(S.reviewMode){
    const un=unanswered().map(c=>c._i).filter(i=>i>idx);
    next=un.length?$(`#feed .card[data-idx="${un[0]}"]`):$(`#feed .card[data-idx="${S.cards.length-1}"]`);
  } else {
    next=$(`#feed .card[data-idx="${idx+1}"]`);
  }
  if(!next)return;
  setTimeout(()=>{
    // Check we're still on the same card
    if(S.page==="lesson" && S.activeIdx===idx){
      next.scrollIntoView({behavior:"smooth",block:"start"});
    }
  },delay);
}

function tapifyNode(el){
  if(!el||el.dataset.tapified)return; el.dataset.tapified="1";
  const skip=new Set(["SCRIPT","STYLE","BUTTON"]);
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!/[A-Za-z]{2,}/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    if(n.parentElement&&(skip.has(n.parentElement.tagName)||n.parentElement.closest(".w,.gl")))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];let n;while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(node=>{const span=document.createElement("span");span.innerHTML=wrapWords(esc(node.nodeValue),[]);node.replaceWith(span);});
}
function tapifyExtras(root){root.querySelectorAll(".grammar-teach, .qstem").forEach(tapifyNode);}

function startWritingTimer(){
  if(S.writeTimer){clearInterval(S.writeTimer);S.writeTimer=null;}
  S.writeStartedAt=Date.now();
  updateWritingTimers();
  S.writeTimer=setInterval(()=>{
    const elapsed=Math.floor((Date.now()-S.writeStartedAt)/1000);
    const remaining=Math.max(0,20*60-elapsed);
    document.querySelectorAll("[data-write-timer]").forEach(el=>{
      const m=Math.floor(remaining/60);
      const s=remaining%60;
      el.textContent=`${m}:${String(s).padStart(2,"0")}`;
    });
    document.querySelectorAll("[data-timer-box]").forEach(box=>{
      box.classList.toggle("running",remaining>0);
      box.classList.toggle("done",remaining<=0);
    });
    document.querySelectorAll("[data-start-timer]").forEach(b=>{
      b.textContent=remaining>0?"Running":"Done";
      b.disabled=remaining>0;
    });
    if(remaining<=0){clearInterval(S.writeTimer);S.writeTimer=null;}
  },1000);
}
function updateWritingTimers(){
  if(!S.writeStartedAt)return;
  const elapsed=Math.floor((Date.now()-S.writeStartedAt)/1000);
  const remaining=Math.max(0,20*60-elapsed);
  document.querySelectorAll("[data-write-timer]").forEach(el=>{
    const m=Math.floor(remaining/60);
    const s=remaining%60;
    el.textContent=`${m}:${String(s).padStart(2,"0")}`;
  });
}

const activeSoftTimers={};
function startSoftTimerFor(cardIdx){
  if(activeSoftTimers[cardIdx])return;
  const cardEl=$(`#feed .card[data-idx="${cardIdx}"]`);
  if(!cardEl)return;
  const timer=cardEl.querySelector("[data-soft-timer]");
  if(!timer)return;
  const seconds=+timer.dataset.secs;
  const bar=timer.querySelector("[data-soft-bar]");
  const label=timer.querySelector("[data-soft-time]");
  if(!bar||!label)return;
  let elapsed=0;
  bar.style.width="0%";
  label.textContent=seconds+"s";
  timer.classList.remove("done");
  activeSoftTimers[cardIdx]=setInterval(()=>{
    elapsed++;
    const pct=Math.min(100,(elapsed/seconds)*100);
    bar.style.width=pct+"%";
    label.textContent=Math.max(0,seconds-elapsed)+"s";
    if(elapsed>=seconds){
      clearInterval(activeSoftTimers[cardIdx]);
      delete activeSoftTimers[cardIdx];
      timer.classList.add("done");
    }
  },1000);
}
function stopAllSoftTimers(){
  Object.keys(activeSoftTimers).forEach(k=>{clearInterval(activeSoftTimers[k]);delete activeSoftTimers[k];});
}
