/* ============================================================
   OBSERVER — HUD + auto-speak + soft timers
   ============================================================ */
let observer=null;
function setupObserver(){
  if(observer)observer.disconnect();
  /* Older/in-app mobile browsers may lack IntersectionObserver. Keep the lesson usable. */
  if(typeof window.IntersectionObserver!=="function"){
    const feedEl=$("#feed");
    const fallbackUpdate=()=>{
      const cards=[...feedEl.querySelectorAll(".card")];
      if(!cards.length)return;
      const mid=feedEl.getBoundingClientRect().top+feedEl.clientHeight*.45;
      let best=cards[0],dist=Infinity;
      cards.forEach(el=>{const r=el.getBoundingClientRect();const d=Math.abs((r.top+r.bottom)/2-mid);if(d<dist){dist=d;best=el;}});
      const idx=+best.dataset.idx;
      if(Number.isFinite(idx)&&idx!==S.activeIdx){
        S.activeIdx=idx;S.currentSection=S.cards[idx]?.section||"Overview";updateHUD(idx);scheduleVocabReveal(idx);
        if(S.lesson)storage.setItem(posKey(),String(idx));
      }
    };
    if(!feedEl._fallbackObserverBound){feedEl.addEventListener("scroll",fallbackUpdate,{passive:true});window.addEventListener("resize",fallbackUpdate);feedEl._fallbackObserverBound=true;}
    fallbackUpdate();
    return;
  }
  observer=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting&&e.intersectionRatio>0.55){
        const idx=+e.target.dataset.idx;
        if(idx===S.activeIdx)return;
        const prevIdx=S.activeIdx;
        S.activeIdx=idx;
        S.currentSection=S.cards[idx].section;
        updateHUD(idx);
        if(S.cards[idx].type==="session-done")fillSessionDone();
        if(S.cards[idx].type==="quiz-result")fillQuiz();
        if(S.cards[idx].type==="cp-result")fillCheckpoint();
        scheduleVocabReveal(idx);
        storage.setItem(posKey(),String(idx));

        // Auto-stop TTS on card change
        stopSpeak();
        // Stop previous soft timer (each card's timer auto-stops itself, but on leave we stop)
        // Actually soft timers can keep running to completion; that's fine.

        // Auto-speak on vocab cards (once per card visit)
        if(soundOn && idx!==S.lastSpokenIdx && S.cards[idx].type==="vocab"){
          S.lastSpokenIdx=idx;
          setTimeout(()=>{
            if(S.activeIdx===idx){
              const btn=document.querySelector(`#feed .card[data-idx="${idx}"] [data-speak]`);
              speak(S.cards[idx].word,btn);
            }
          },280);
        }

        // Start soft timer for skim/scan


        const c=S.cards[idx];
        if(c.type==="vocab"&&c.idx===LESSONS[S.lesson].vocab.length-1){markDone(S.lesson+"_vocab_flash");syncVocab();}
        if(c.type==="wrap")markDone(S.lesson+"_feed");
        if(c.type==="passage"&&c.idx===LESSONS[S.lesson].grammar.passages.length-1)markDone(S.lesson+"_g_passages");
      }
    });
  },{threshold:[0.55]});
  document.querySelectorAll("#feed .card").forEach(el=>observer.observe(el));
}
function updateHUD(idx){
  const nb=$("#nextBtn");if(nb)nb.style.display=(idx>=S.cards.length-1)?"none":"";
  const sf=$("#sessFill");if(sf)sf.style.width=Math.round(((idx+1)/S.cards.length)*100)+"%";
  const hud=$("#hud");
  hud.style.setProperty("--c",sectionColor(S.cards[idx]?.section||"Overview"));

function buildSheetHTML(){
  const sections=[];
  let cur=null;
  S.cards.forEach(c=>{
    const name=c.section;
    if(!cur||cur.name!==name){cur={name,cards:[]};sections.push(cur);}
    cur.cards.push(c);
  });
  const doneMap={
    "Vocabulary":progress[S.lesson+"_vocab"],
    "Grammar":progress[S.lesson+"_grammar"],
    "Reading":progress[S.lesson+"_reading"],
    "Writing":progress[S.lesson+"_writing"],
    "Test":progress[S.lesson+"_g_test"],"Matching":progress[S.lesson+"_vocab_match"],"Gap-fill":progress[S.lesson+"_vocab_gap"],
    "Passages":progress[S.lesson+"_g_passages"]
  };
  const isSectionLocked=(sec)=>{
    if(sec.name==="Locked")return true;
    return sec.cards[0].type==="locked-placeholder";
  };

  let html=`<div class="sheet-hero">
    <div class="k">Lesson ${S.lesson}</div>
    <div class="t">${esc(LESSONS[S.lesson].title)}</div>
    <div class="m">${S.cards.length} cards · tap a section to jump</div>
  </div>`;

  sections.forEach(sec=>{
    if(sec.name==="Overview")return;
    const total=sec.cards.length;
    const isCurrent=S.currentSection===sec.name;
    const isDone=doneMap[sec.name];
    const locked=isSectionLocked(sec);

    if(locked){
      const targetCard=sec.cards[0];
      html+=`<div class="sheet-section locked">
        <div class="sheet-locked-row">
          <span class="lock">🔒</span>
          <span style="flex:1">${esc(targetCard.target||sec.name)} — complete <b style="color:var(--fg)">${esc(targetCard.prereq||"")}</b> first</span>
        </div>
      </div>`;
      return;
    }

    const status=isDone?"✓":isCurrent?"●":`${total}`;
    const statusClass=isDone?"done":isCurrent?"active":"";

    const cardRows=sec.cards.map(c=>{
      return `<button class="sheet-card-row ${c._i===S.activeIdx?"current":""}" data-jump="${c._i}">
        <span class="n">${c._i+1}</span>
        <span class="t">${cardLabel(c)}</span>
      </button>`;
    }).join("");

    html+=`<div class="sheet-section ${isCurrent?"current":""}" data-sec-name="${sec.name}">
      <div class="sheet-sec-row">
        <button class="sheet-sec-jump" data-jump-sec="${sec.name}">
          <span class="dot" style="background:${sectionColor(sec.name)}"></span>
          <span class="name">${esc(sec.name)}</span>
          <span class="status ${statusClass}">${status}</span>
        </button>
        <button class="chev" data-toggle-sec type="button">▾</button>

      <div class="sheet-cards">${cardRows}</div>

  });
  return html;
}
function cardLabel(c){
  if(c.type==="vocab")return c.word;
  if(c.type==="matching")return `Matching set ${c.set}`;
  if(c.type==="gap")return `Gap-fill ${c.idx+1}`;
  if(c.type==="grammar-teach")return `Point ${c.idx+1}: ${c.title}`;
  if(c.type==="grammar-check")return `Check: ${c.q}`;
  if(c.type==="test-q")return `Q${c.idx+1}. ${c.q}`;
  if(c.type==="passage")return c.title;
  if(c.type==="reading-skim")return `Skim: ${c.topic||c.title}`;
  if(c.type==="reading-scan")return `Scan: ${c.topic||c.title}`;
  if(c.type==="reading-full")return `Read: ${c.topic||c.title}`;
  if(c.type==="writing")return `Prompt ${c.idx+1}`;
  if(c.type==="section-intro")return `${c.name} intro`;

}

/* Vertical paging: one card per swipe / wheel / key. Inner scrollers keep native scroll until their edge. */
(()=>{
  const area=$("#feed");let sx=0,sy=0,tracking=false,claimed=false,inner=false,lock=0,touching=false,settle=null,pend=null,tgt=null;
  const curIdx=()=>Math.max(0,Math.min(area.children.length-1,Math.round(area.scrollTop/(area.clientHeight||1))));
  function pageBy(d){
    if(S.page!=="lesson"||Date.now()<lock)return;
    const i=pend!=null?pend:curIdx(),t=Math.max(0,Math.min(area.children.length-1,i+d));
    if(t===i)return;
    pend=t;lock=Date.now()+420;
    area.children[t].scrollIntoView({behavior:"smooth",block:"start"});
    setTimeout(()=>{pend=null;},520);
  }
  window.tsPageBy=pageBy;
  const scroller=(el,d)=>{for(;el&&el!==area;el=el.parentElement){if(el.scrollHeight>el.clientHeight+2){const o=getComputedStyle(el).overflowY;if(o==="auto"||o==="scroll"){if(d<0&&el.scrollTop+el.clientHeight<el.scrollHeight-2)return true;if(d>0&&el.scrollTop>2)return true;}}}return false;};
  area.addEventListener("touchstart",e=>{if(S.page!=="lesson"||e.touches.length!==1){tracking=false;return;}touching=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;claimed=false;inner=false;tgt=e.target;},{passive:true});
  area.addEventListener("touchmove",e=>{
    if(!tracking||inner||e.touches.length!==1)return;
    const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(claimed){e.preventDefault();return;}
    if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)*1.15){
      if((tgt&&tgt.closest&&tgt.closest("textarea,input,select,.word-popup"))||scroller(tgt,dy)){inner=true;return;}
      claimed=true;e.preventDefault();
    }
  },{passive:false});
  area.addEventListener("touchend",e=>{
    touching=false;if(!tracking)return;tracking=false;
    if(inner||!claimed||S.page!=="lesson")return;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dy)>=55&&storage.getItem("ts3_swipe")!=="0")pageBy(dy<0?1:-1);
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  area.addEventListener("touchcancel",()=>{tracking=false;claimed=false;touching=false;},{passive:true});
  area.addEventListener("wheel",e=>{
    if(S.page!=="lesson"||Math.abs(e.deltaY)<20||scroller(e.target,-e.deltaY))return;
    e.preventDefault();pageBy(e.deltaY>0?1:-1);
  },{passive:false});
  document.addEventListener("keydown",e=>{
    if(S.page!=="lesson"||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||""))return;
    if(e.key==="ArrowDown"||e.key==="PageDown"||e.key===" "){e.preventDefault();pageBy(1);}
    else if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();pageBy(-1);}
  });
  area.addEventListener("scroll",()=>{
    if(S.page!=="lesson")return;
    clearTimeout(settle);
    settle=setTimeout(()=>{if(touching||pend!=null)return;const h=area.clientHeight,t=Math.round(area.scrollTop/h)*h;if(Math.abs(area.scrollTop-t)>3)area.scrollTo({top:t,behavior:"smooth"});},160);
  },{passive:true});
})();

/* Horizontal swipe: right = previous section, left = next available section */
(()=>{let sx=0,sy=0,origin=null;const area=$("#feed");area.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;origin=e.target;},{passive:true});area.addEventListener("touchend",e=>{if(!origin)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;const targetEl=origin;origin=null;if(Math.abs(dx)<90||Math.abs(dx)<Math.abs(dy)*1.35)return;if(S.page!=="lesson")return;if(targetEl.closest("button,a,input,textarea,select,[data-flip],[data-speak],[data-match],[data-gap],[data-gcheck],.reading-scroll,.word-popup,.sheet,.opt"))return;const names=[...new Set(S.cards.map(c=>c.section))].filter(n=>n!=="Locked");const i=names.indexOf(S.currentSection);if(i<0)return;const target=dx<0?names[i+1]:names[i-1];if(target)jumpToSection(target);},{passive:true});})();

function startSrsSession(){
  const due=shuffle(srs.filter(c=>c.nextReview<=Date.now()));
  if(!due.length)return;
  let queue=[...due], done=0, total=due.length;
  const feed=$("#feed");
  function render(){
    if(!queue.length){
      feed.innerHTML=`<section class="card" data-sec="overview"><div class="card-inner"><div class="center">
        <div style="font-size:64px">🎉</div>
        <h1 class="h-big" style="margin-top:12px">Done!</h1>
        <p class="p">You reviewed ${done} cards.</p>
      </div><div class="spacer"></div><button class="btn btn-primary btn-block" id="srsEnd">Back</button></div></section>`;
      feed.scrollTop=0;
      $("#srsEnd").onclick=()=>showPage("practice");
      return;
    }
    const card=queue[0];
    feed.innerHTML=`<section class="card" data-sec="Vocabulary"><div class="card-inner">
      <div class="vocab-count"><span>Card ${done+1} / ${total}</span><div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div></div>
      <div class="srs-card" id="srsCard">
        <div class="front">${esc(card.front)}</div>
        <div class="back hidden">${card.ex?`<div style="font-family:var(--serif);font-style:italic">"${esc(card.ex)}"</div>`:""}${card.backFa?`<div class="fa">${esc(card.backFa)}</div>`:""}</div>
        <div class="srs-hint">Tap to reveal</div>
      </div>
      <div class="rate-grid hidden" id="rateGrid">
        <button class="rate-btn r0" data-r="0">Again</button>
        <button class="rate-btn r1" data-r="1">Hard</button>
        <button class="rate-btn r2" data-r="2">Good</button>
        <button class="rate-btn r3" data-r="3">Easy</button>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-block" id="srsEnd">End session</button>
    </div></section>`;
    feed.scrollTop=0;
    $("#srsCard").onclick=()=>{
      $("#srsCard .back").classList.remove("hidden");
      $("#srsCard .srs-hint").classList.add("hidden");
      $("#rateGrid").classList.remove("hidden");
      if(soundOn)speak(card.front);
    };
    feed.querySelectorAll(".rate-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        const r=+b.dataset.r;
        updateSrs(card,r);bumpMetric("review",1);
        if(r===0)queue.push(queue.shift()); else {queue.shift();done++;}
        sClick(); render();
      });
    });
    $("#srsEnd").onclick=()=>showPage("practice");
  }
  render();
}
function updateSrs(card,r){
  const c=srs.find(x=>x.id===card.id); if(!c)return;
  if(r===0){c.reps=0;c.interval=0;c.ease=Math.max(1.3,c.ease-.2);}
  else{if(c.reps===0)c.interval=r===1?1:r===2?2:4;
    else if(c.reps===1)c.interval=r===1?2:r===2?4:7;
    else{const f=r===1?1.2:r===2?c.ease:c.ease*1.3;c.interval=Math.max(1,Math.round(c.interval*f));}
    c.reps++; if(r===1)c.ease=Math.max(1.3,c.ease-.15); else if(r===3)c.ease=Math.min(3,c.ease+.1);}
  c.lastReviewed=Date.now();
  c.nextReview=Date.now()+c.interval*86400000;
  saveS();
}

    {icon:"🎯",title:"هدف اصلی این سطح",body:"در این سطح، هدف یادگیریِ گرامرِ سطح میانی و به‌کارگیری آن در صحبت‌کردن است. همچنین یاد می‌گیری با متن‌های واقعی انگلیسی کار کنی — نه اینکه تک‌تک کلمات را بفهمی، بلکه پیام اصلی متن را بگیری. بخش «Articles» دقیقاً همین مهارت را تمرین می‌دهد."},
    {icon:"🗣️",title:"کلاس، جای تمرینِ حرف‌زدن",body:"چون گرامر و خواندن و نوشتن را همین‌جا یاد می‌گیری، وقت کلاس با معلم صرفِ صحبت‌کردن می‌شود."},
  ];
  let i=0;
  const render=()=>{
    const sl=slides[i];
    showModal(`
      <div class="m-icon">${sl.icon}</div>
      <div class="m-title">${sl.title}</div>
      <div class="m-body" dir="rtl" style="font-family:var(--farsi);line-height:1.9">${sl.body}</div>
      <div style="display:flex;gap:6px;justify-content:center;margin:14px 0 4px">${slides.map((_,k)=>`<span style="width:${k===i?18:6}px;height:6px;border-radius:6px;background:${k===i?"var(--accent)":"var(--line-strong)"};transition:width .2s"></span>`).join("")}</div>
      <div class="btn-row">
        <button class="btn btn-primary btn-block" id="obNext">${i<slides.length-1?"بعدی":"شروع کن"}</button>
      </div>
    `);
    modalClose=()=>{$("#modal").classList.remove("show");};
    $("#obNext").onclick=()=>{if(i<slides.length-1){i++;render();}else{modalClose();sChime();}};
  };
  render();
}

function promptName(firstTime){
  showModal(`
    <div class="m-icon">👋</div>
    <div class="m-title">${firstTime?"Welcome!":"Change your name"}</div>
    <div class="m-body">${firstTime?"What should we call you?":"Enter a new name:"}</div>
    <input type="text" class="name-input" id="nameInput" placeholder="Your name" value="${escAttr(userName)}" maxlength="20">
    <div class="btn-row">
      ${!firstTime?`<button class="btn btn-ghost" data-close>Cancel</button>`:""}
      <button class="btn btn-primary" id="saveName">${firstTime?"Let's go!":"Save"}</button>
    </div>
  `);
  const inp=$("#nameInput");
  setTimeout(()=>inp.focus(),150);
  $("#saveName").onclick=()=>{
    const v=inp.value.trim();
    if(!v){inp.focus();return;}
    userName=v;storage.setItem("ts3_name",v);
    modalClose();sChime();
    if(S.page==="home")renderHome();
    if(firstTime)setTimeout(showOnboarding,350);
  };
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")$("#saveName").click();});
}

/* ============================================================
   TIME TRACKING
   ============================================================ */
let sectionStart=Date.now();
let currentTracked="shelf";
function startTime(s){flushTime();currentTracked=s;sectionStart=Date.now();}
function flushTime(){const ms=Math.max(0,Date.now()-sectionStart);if(ms>0&&(currentTracked==="learn"||currentTracked==="practice"))recordTime(Math.min(ms,30*60000));sectionStart=Date.now();}
document.addEventListener("visibilitychange",()=>{if(document.hidden){flushTime();stopSpeak();}else sectionStart=Date.now();});
window.addEventListener("beforeunload",flushTime);

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeSheet();hidePopup();stopSpeak();}
  if((e.key==="m"||e.key==="j")&&S.page==="lesson"&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||""))openSheet();
});

/* ============================================================
   BOOT
   ============================================================ */
/* Register service worker when served from HTTPS/localhost (required for installable offline PWA). */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("PWA service worker registration failed",err)));
}
(function boot(){
  document.documentElement.setAttribute("data-theme",theme);
  showPage("home");
  $("#feed").addEventListener("scroll",hidePopup,{passive:true});
  $("#nextBtn").onclick=()=>{stopSpeak();if(window.tsPageBy)window.tsPageBy(1);};
  if(!userName){setTimeout(()=>promptName(true),400);}
  startTime("shelf");
})();
</script>
